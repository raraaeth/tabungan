<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
name="theme-color"
content="#8EDCC6">

<meta
name="description"
content="Tabungan Liburan Bersama">

<title>🌴 Tabungan Liburan</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<!-- ===========================
     HERO
=========================== -->

<header class="hero">

<div class="hero-content">

<h1>

🌴 Tabungan Liburan

</h1>

<p>

Yuk kita sukseskan nabung
untuk liburan kita nanti ✈️

</p>

<div class="target-card">

<div class="target-title">

🎯 Target Liburan

</div>

<h2 id="targetValue">

Rp0 / Rp3.000.000

</h2>

<div class="progress">

<div
id="progressBar"
class="progress-bar">

</div>

</div>

<div
id="progressText"
class="progress-text">

0%

</div>

<p
id="heroInsight"
class="hero-insight">

Memuat data...

</p>

</div>

</div>

</header>

<!-- ===========================
     MAIN
=========================== -->

<main class="container">

<!-- SUMMARY -->

<section>

<div class="summary-grid">

<div
class="card"
id="saldoCard">

</div>

<div
class="card"
id="masukCard">

</div>

<div
class="card"
id="bungaCard">

</div>

</div>

</section>

<!-- MEMBER -->

<section>

<h2>

👨‍👩‍👧 Tabungan Anggota

</h2>

<div
id="memberList"
class="member-list">

</div>

</section>

<!-- REMINDER -->

<section>

<h2>

🔔 Belum Menabung Bulan Ini

</h2>

<div
id="reminderList">

</div>

</section>

<!-- LOAN -->

<section>

<h2>

💸 Riwayat Pinjaman

</h2>

<div
id="loanList">

</div>

</section>

<!-- ACTIVITY -->

<section>

<div class="section-header">

<h2>

🕒 Aktivitas Terbaru

</h2>

<button
id="toggleTransaction">

Lihat Semua

</button>

</div>

<div
id="transactionList"
class="transaction-list">

</div>

</section>

</main>

<footer>

🌴
Semoga liburan impian kita segera terwujud.

</footer>

<script src="script.js"></script>

</body>

</html>
